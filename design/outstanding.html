<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outstanding</title>
<style>
body{margin:0;font-family:-apple-system,"Helvetica Neue",Helvetica,sans-serif;background:#f6f3ec;color:#1b1a17}

</style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px 24px; display: flex; flex-direction: column; gap: 20px; background: #f6f3ec;">
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1.1; color: #1b1a17;">Who has my stuff</div>
    <div style="font-size: 15px; color: #5b574f;">Everything still out, oldest first.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #ffffff; border: 1px solid #e2ddd1; border-radius: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
        <div style="font-size: 18px; font-weight: 600; color: #1b1a17;">Folding camp chair</div>
        <div style="font-size: 13px; color: #8a4b1f; font-weight: 600;">68 days</div>
      </div>
      <div style="font-size: 15px; color: #5b574f;">Alex has it. Out since Jul 14, 2026.</div>
      <a href="mark-returned.html" style="align-self: flex-start; display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #2f5d4a; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; color: #2f5d4a;">Mark returned</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #ffffff; border: 1px solid #e2ddd1; border-radius: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
        <div style="font-size: 18px; font-weight: 600; color: #1b1a17;">Green-handled pruning shears</div>
        <div style="font-size: 13px; color: #5b574f; font-weight: 600;">50 days</div>
      </div>
      <div style="font-size: 15px; color: #5b574f;">Sam has them. Out since Aug 1, 2026.</div>
      <a href="mark-returned.html" style="align-self: flex-start; display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #2f5d4a; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; color: #2f5d4a;">Mark returned</a>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="lend.html" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #2f5d4a; color: #ffffff; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none;">Lend something</a>

  <!-- FULFILS
       US-OUT-10 · FR-OUT-10 · AC-OUT-10
       Reads the same file the command line writes; nothing here is stored anywhere else.
       These IDs are for the agents and the Gate. They were visible on this screen
       until 2026-09-21; a person lending a chair to a neighbour has no use for a
       registry ID, and the screens are what the software looks like to them. -->
  <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid #e2ddd1;">
    <div style="font-size: 12px; color: #5b574f;">Your records are in a file on this machine and nowhere else.</div>
  </div>
</div>
