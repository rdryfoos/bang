<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nothing out</title>
<style>
body{margin:0;font-family:-apple-system,"Helvetica Neue",Helvetica,sans-serif;background:#f6f3ec;color:#1b1a17}
a{color:#2f5d4a}a:hover{color:#1f4232}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px 24px; display: flex; flex-direction: column; gap: 20px; background: #f6f3ec;">
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1.1; color: #1b1a17;">Who has my stuff</div>
    <div style="font-size: 15px; color: #5b574f;">Everything still out, oldest first.</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 24px; background: #ffffff; border: 1px solid #e2ddd1; border-radius: 12px; text-align: center;">
    <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: #1b1a17;">Nothing is out.</div>
    <div style="font-size: 15px; color: #5b574f;">Everything you lent has come back, or you have not lent anything yet.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="lend.html" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #2f5d4a; color: #ffffff; border-radius: 12px; font-size: 17px; font-weight: 600; text-decoration: none;">Lend something</a>

  <!-- FULFILS
       AC-OUT-20
       Says in words that nothing is outstanding, rather than showing an empty screen.
       These IDs are for the agents and the Gate. They were visible on this screen
       until 2026-09-21; a person lending a chair to a neighbour has no use for a
       registry ID, and the screens are what the software looks like to them. -->
  <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 1px solid #e2ddd1;">
    <div style="font-size: 12px; color: #5b574f;">Your records are in a file on this machine and nowhere else.</div>
  </div>
</div>
</body>
</html>
