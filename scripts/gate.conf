# gate.conf: the project's gate script configuration. Read by scripts/gate.sh. Every
# value is the project owner's; each line says what it must hold.
# TEST_COMMAND: the project's test run, emitting a machine-readable results report at
# TEST_RESULTS. Filled at Spec Kit init from the project's toolchain.
# Set at birth from constitution III, which names the runtimes this project may use.
TEST_COMMAND="python3 -m pytest -q --junitxml=test-results.xml"
# TEST_RESULTS: the results report path the SpecAssay configuration names as its
# test_results. Filled at Spec Kit init.
TEST_RESULTS="test-results.xml"
# JOURNAL_PREFIX: the recorder's journal prefix in this repository.
JOURNAL_PREFIX="journal"
# CANNON_HOME: the Cannon's global directory holding its session logs, as the daemon's
# own configuration names it. Filled from the genesis ledger's 1.3 receipt.
CANNON_HOME="/Users/spudnik/.potato-cannon"
# SPECASSAY_CHECK: the SpecAssay Gate 2 script inside this repository after install.
SPECASSAY_CHECK=".specify/extensions/specassay-check/scripts/check-traceability.sh"
# DEFAULT_BRANCH: the repository's default branch name on the host.
DEFAULT_BRANCH="main"
# RECEIPT_SOURCE: where the Done check reads its proof that the Gate passed on a
# commit, "forge" or "local". forge means a CI run recorded at the host; the gate
# script writes nothing and a second party attests. local means this script writes
# a receipt into the journal when it runs on DEFAULT_BRANCH, and the machine that
# built the change is the only party attesting it. An project on local declares that
# in SURFACE. Default forge, so an project that says nothing keeps the independent
# receipt.
RECEIPT_SOURCE="local"
# BRANCH_PREFIX: the prefix the Cannon gives a card's worktree branch, so the
# promotion hook can name the branch it merges. The daemon defaults it to "potato"
# and does not report it on its project list, which is why it is stated here rather
# than read. A card overrides it with a branch: line of its own.
BRANCH_PREFIX="potato"
